<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>장금상선 터미널 3사 현황</title>
<style>
:root {
  color-scheme: light;
  --plane:#f1f3f2; --surface:#fdfdfc; --surface-sunk:#f6f8f7;
  --ink:#0d1211; --ink-2:#4d5856; --ink-muted:#7f8987;
  --hair:rgba(13,18,17,0.11); --grid:#e3e6e2; --baseline:#c2c7c3;
  /* 터미널 식별색 — 검증 완료(all-pairs, light/dark 양쪽 PASS) */
  --t-bpt:#2a78d6; --t-gwct:#eb6834; --t-juct:#1baf7a;
  --s1:#2a78d6;
  --seg-etc:#cfd4d1; --seg-tre:#a9b0ad; --seg-out:#6d7a84;
  --good:#0ca30c; --good-text:#006300; --warning:#fab219; --critical:#d03b3b;
  --shadow:0 1px 2px rgba(13,18,17,.05), 0 8px 24px -16px rgba(13,18,17,.22);
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --mono:ui-monospace,"Cascadia Mono","Consolas","DejaVu Sans Mono",monospace;
  /* 숫자용 — 고정폭보다 자획이 굵고 열려 있어 작은 크기에서 잘 읽힌다.
     tabular-nums로 자릿수 폭을 맞추므로 표 정렬은 그대로 유지된다. */
  --num:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,ui-sans-serif,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --plane:#0b0e0e; --surface:#171b1b; --surface-sunk:#121616;
    --ink:#fff; --ink-2:#c1c5c0; --ink-muted:#898f8c;
    --hair:rgba(255,255,255,.12); --grid:#282c2b; --baseline:#363a39;
    --t-bpt:#3987e5; --t-gwct:#d95926; --t-juct:#199e70;
    --s1:#3987e5;
    --seg-etc:#4a504e; --seg-tre:#666d6a; --seg-out:#8b98a3;
    --good-text:#0ca30c;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --plane:#0b0e0e; --surface:#171b1b; --surface-sunk:#121616;
  --ink:#fff; --ink-2:#c1c5c0; --ink-muted:#898f8c;
  --hair:rgba(255,255,255,.12); --grid:#282c2b; --baseline:#363a39;
  --t-bpt:#3987e5; --t-gwct:#d95926; --t-juct:#199e70;
  --s1:#3987e5;
  --seg-etc:#4a504e; --seg-tre:#666d6a; --seg-out:#8b98a3;
  --good-text:#0ca30c;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);font-family:var(--sans);
     font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 72px;display:flex;flex-direction:column;gap:20px}
.eyebrow{font-size:10.5px;font-weight:650;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted)}
h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-.025em;text-wrap:balance}
h2{margin:0;font-size:14px;font-weight:640;letter-spacing:-.01em}
.mono{font-family:var(--num);font-variant-numeric:tabular-nums}

.masthead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px}
.headright{display:flex;flex-direction:column;align-items:flex-end;gap:9px}
.asof{text-align:right;font-size:12.5px;color:var(--ink-muted)}
.printgroup{display:flex;gap:7px}
.printbtn{font:inherit;font-size:12.5px;font-weight:620;color:var(--ink-2);cursor:pointer;
      display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
      padding:7px 13px;border:1px solid var(--hair);border-radius:4px;background:var(--surface);
      transition:border-color .14s ease,color .14s ease,background .14s ease}
.printbtn:hover{border-color:var(--s1);color:var(--s1)}
.printbtn:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
.printbtn:disabled{opacity:.5;cursor:default;pointer-events:none}
.print-only{display:none}
.asof .d{font-family:var(--num);font-size:13.5px;color:var(--ink);font-weight:600}

.groupbar{display:flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--hair);
          border-radius:4px;overflow:hidden}
.gb{padding:11px 16px;border-right:1px solid var(--hair);display:flex;flex-direction:column;gap:2px}
.gb:last-child{border-right:0}
.gb .k{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.gb .v{font-size:13px;font-weight:620}

.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
/* 3사는 한 줄에 나란히 두는 게 기본. 2열은 2+1로 갈려 보기 나쁘므로 쓰지 않고,
   폭이 부족해지면 이름 글자를 줄여 버티다가 820px 이하에서 1열로 내린다. */
@media screen and (max-width:1010px){
  .tab{padding:12px 13px 11px}
  .tab-name{font-size:12.5px}
  .tab-code{font-size:14px}
  .tab-sub{font-size:10.5px}
}
@media screen and (max-width:820px){ .tabs{grid-template-columns:1fr} }
.tab{position:relative;text-align:left;font:inherit;color:inherit;cursor:pointer;
     background:var(--surface);border:1px solid var(--hair);border-radius:4px;
     padding:13px 15px 12px;overflow:hidden;display:flex;flex-direction:column;gap:9px;
     transition:border-color .16s ease,transform .16s ease,box-shadow .16s ease}
.tab::before{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:var(--t);
             transform:scaleX(0);transform-origin:left;transition:transform .18s ease}
.tab:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--t) 45%,var(--hair))}
.tab:focus-visible{outline:2px solid var(--t);outline-offset:2px}
.tab[aria-selected="true"]{border-color:color-mix(in srgb,var(--t) 62%,var(--hair));box-shadow:var(--shadow)}
.tab[aria-selected="true"]::before{transform:scaleX(1)}
.tab-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.tab-code{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:.05em;
          display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.tab-code .tdot{width:10px;height:10px;border-radius:2px;background:var(--t);flex:none}
.tab-name{font-size:13.5px;font-weight:640;letter-spacing:-.022em;white-space:nowrap}
.tab-sub{font-size:11.5px;color:var(--ink-muted)}
.tab-metrics{display:flex;flex-direction:column;gap:5px}
.metric{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2)}
.metric .mk{flex:none;width:56px;color:var(--ink-muted)}
.metric .mtrack{flex:1;min-width:24px;height:6px;border-radius:3px;
               background:color-mix(in srgb,var(--t) 16%,transparent);overflow:hidden}
.metric .mfill{height:100%;border-radius:3px;background:var(--t)}
.metric .mfill.neg{background:var(--critical)}
.metric .mfill.over{border-radius:3px 0 0 3px;box-shadow:inset -3px 0 0 var(--ink)}
.metric .mv{flex:none;width:66px;text-align:right;white-space:nowrap;font-family:var(--num);font-size:13px;
            font-weight:650;font-variant-numeric:tabular-nums;color:var(--ink)}
.metric .mfill.behind{background:var(--critical)}
.metric .mv.behind{color:var(--critical)}
.metric .mtrack{position:relative}
.metric .mmark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink-muted);
               opacity:.75;border-radius:1px}
.tab-cap{font-size:13px;font-weight:650;color:var(--ink-2);padding-left:63px}

[hidden]{display:none!important}
.panel{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:4px;padding:18px;
      display:flex;flex-direction:column;gap:14px}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}

.card-head.clickable{cursor:pointer;user-select:none;border-radius:3px;
      margin:-4px -6px;padding:4px 6px;transition:background .12s ease}
.card-head.clickable:hover{background:var(--surface-sunk)}
.card-head.clickable:focus-visible{outline:2px solid var(--t);outline-offset:2px}

.disc{display:inline-flex;align-items:center;gap:6px;flex-shrink:0;
      padding:5px 10px;border:1px solid var(--hair);border-radius:3px;
      background:var(--surface-sunk);font-size:11.5px;font-weight:600;color:var(--ink-2)}
.card-head.clickable:hover .disc{border-color:var(--t);color:var(--t)}
.disc .chev{font-size:10px;line-height:1;transition:transform .15s ease}
.disc.open .chev{transform:rotate(180deg)}
.card-note{font-size:11.5px;color:var(--ink-muted);max-width:74ch;word-break:keep-all;line-height:1.55}
.card-note.wide{max-width:none}

.unittag{flex-shrink:0;align-self:flex-start;padding:4px 9px;border:1px solid var(--hair);
      border-radius:3px;background:var(--surface-sunk);font-family:var(--mono);
      font-size:11.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}

.perfwrap{overflow-x:auto;margin:0 -2px;padding:0 2px}
.perf{border-collapse:collapse;font-size:13.5px;min-width:100%}
.perf th,.perf td{white-space:nowrap}
.perf thead th{text-align:right;font-size:12px;letter-spacing:.04em;color:var(--ink-muted);
      font-weight:620;padding:0 10px 8px;border-bottom:1px solid var(--baseline)}
.perf thead th:first-child{text-align:left;padding-left:0}
.perf tbody td{padding:8px 10px;border-bottom:1px solid var(--grid);text-align:right;
      font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:500;color:var(--ink-2)}
.perf tbody td:first-child{text-align:left;padding-left:0;font-family:inherit;
      color:var(--ink-2);font-weight:600;position:sticky;left:0;background:var(--surface);
      padding-right:16px;z-index:1}
.perf thead th:first-child{position:sticky;left:0;background:var(--surface);z-index:2}
.perf tbody tr:hover td:first-child{background:var(--surface-sunk)}
.perf tbody tr:last-child td{border-bottom:0}
.perf tbody tr:hover td{background:var(--surface-sunk)}
.perf tbody tr.key td{color:var(--ink);font-weight:650}
.perf tbody tr.rule td{border-top:1px solid var(--baseline)}
.perf .neg{color:var(--critical)}
.perf tbody tr td.neg{color:var(--critical)}
.perf thead th.last,.perf tbody td.last{background:color-mix(in srgb,var(--t) 9%,transparent);
      color:var(--ink);font-weight:650}

.cum{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;
      background:var(--grid);border:1px solid var(--hair);border-radius:4px;overflow:hidden}
.cum .ci{background:var(--surface);padding:13px 14px;display:flex;flex-direction:column;gap:5px;min-width:0}
.cum .ci .k{font-size:12px;color:var(--ink-muted)}
.cum .ci .v{font-family:var(--num);font-size:23px;font-weight:650;letter-spacing:-.02em;
      font-variant-numeric:tabular-nums;color:var(--ink)}
.cum .ci .v.neg{color:var(--critical)}
.cum .ci .u{font-size:10.5px;font-weight:500;color:var(--ink-muted);margin-left:3px}
@media screen and (max-width:900px){ .cum{grid-template-columns:repeat(2,minmax(0,1fr))} }

.nodata{background:var(--surface);border:1px dashed var(--hair);border-radius:4px;
      padding:22px;text-align:center;font-size:12.5px;color:var(--ink-muted)}

.subtabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;overflow-x:auto;overflow-y:hidden}
.subtab{padding:11px 16px;border:1px solid var(--hair);border-radius:5px;line-height:1.3;
      background:var(--surface);font:inherit;font-size:18px;font-weight:700;
      letter-spacing:-.01em;color:var(--ink-muted);cursor:pointer;white-space:nowrap;
      position:relative;transition:border-color .12s ease,color .12s ease,background .12s ease}
.subtab::after{content:'';position:absolute;left:16px;right:16px;bottom:-1px;height:3px;
      border-radius:2px 2px 0 0;background:transparent;transition:background .12s ease}
.subtab:hover{color:var(--ink-2);border-color:var(--ink-muted)}
.subtab[aria-selected="true"]{background:var(--surface);color:var(--t);
      border-color:var(--t);box-shadow:0 1px 3px rgba(0,0,0,.07)}
.subtab[aria-selected="true"]::after{background:var(--t)}
.subtab:focus-visible{outline:2px solid var(--t);outline-offset:2px}
@media screen and (max-width:560px){
  .subtabs{grid-template-columns:repeat(3,1fr);gap:6px}
  .subtab{padding:11px 12px;font-size:14px}
}
.section{display:flex;flex-direction:column;gap:18px}

.unitlabel{flex-shrink:0;align-self:flex-start;font-size:11.5px;font-weight:600;
      color:var(--ink-muted);white-space:nowrap}

tbody tr.subrow td{background:var(--surface-sunk);font-weight:650;color:var(--ink)}
th.note-cell,td.note-cell{padding-left:22px;text-align:left}
td.note-cell{white-space:normal;font-size:12.5px;color:var(--ink-muted);
      max-width:44ch;line-height:1.5;word-break:keep-all}
thead th.num,tbody td.num{text-align:right}

.spec{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);
      border:1px solid var(--hair);border-left:3px solid var(--t);border-radius:4px;overflow:hidden}
.spec-title{padding:14px 18px;border-right:1px solid var(--hair);display:flex;flex-direction:column;
            gap:3px;min-width:250px;flex:1 1 250px}
.spec-title .nm{font-size:16px;font-weight:650;letter-spacing:-.02em}
.spec-title .op{font-size:11.5px;color:var(--ink-muted)}
.spec-item{padding:11px 18px;border-right:1px solid var(--hair);display:flex;flex-direction:column;gap:3px}
.spec-item:last-child{border-right:0}
.spec-item .k{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted)}
.spec-item .v{font-family:var(--num);font-size:16.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}

.kpis{display:grid;grid-template-columns:1.4fr repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--hair);border-radius:4px;
      padding:15px 16px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .label{font-size:12px;color:var(--ink-2)}
.tile .value{font-size:24px;font-weight:650;letter-spacing:-.03em;line-height:1.1}
.tile .unit{font-size:12px;font-weight:500;color:var(--ink-muted);margin-left:3px;letter-spacing:0}
.tile.hero .value{font-size:50px;letter-spacing:-.04em}
.tile .sub{font-size:12px;color:var(--ink-muted);font-family:var(--num);font-variant-numeric:tabular-nums}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-family:var(--num)}
.delta.up{color:var(--good-text)} .delta.down{color:var(--critical)}

.stack{position:relative}
.stack svg{display:block;width:100%;height:auto}
.valuelist{display:flex;flex-wrap:wrap;gap:8px 20px}
.vitem{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2)}
.vitem .swatch{width:10px;height:10px;border-radius:2px;flex:none}
.vitem .pc{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:650;font-size:13px;color:var(--ink)}
.vitem.us .nm{font-weight:650;color:var(--ink)}

.fin{display:flex;flex-direction:column;gap:0}
.finrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
        padding:8px 0;border-bottom:1px solid var(--grid);font-size:12.5px}
.finrow:last-child{border-bottom:0}
.finrow .k{color:var(--ink-2)}
.finrow .v{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600}
.finrow.em .k{color:var(--ink);font-weight:620}
.finhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
         font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);
         padding:10px 0 6px;border-bottom:1px solid var(--baseline)}

.finhead .per{font-family:var(--num);font-size:11px;letter-spacing:0;text-transform:none;
         color:var(--ink-muted);font-weight:600;white-space:nowrap}
.finhead:first-child{padding-top:0}

.comp{display:flex;flex-direction:column;gap:11px}
.comp-row{display:flex;align-items:center;gap:10px;font-size:12.5px}
.comp-row .lbl{flex:1;color:var(--ink-2)}
.comp-row .n{font-family:var(--num);font-weight:650;font-size:13.5px}
.divider{border-top:1px solid var(--grid);margin:2px 0}
.badge{display:inline-flex;align-items:baseline;gap:6px;padding:5px 10px;border:1px solid var(--hair);
       border-radius:3px;background:var(--surface-sunk);font-size:11.5px;color:var(--ink-2)}
.badge .n{font-family:var(--num);font-weight:700;font-size:15px;color:var(--ink)}

.tablescroll{overflow-x:auto}

table.roster thead th,table.roster tbody td{text-align:center;padding:7px 10px;vertical-align:middle}
table.roster thead th{padding-bottom:8px}
table.roster tbody td.career{text-align:center;line-height:1.45}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
         color:var(--ink-muted);font-weight:620;padding:0 12px 8px 0;
         border-bottom:1px solid var(--baseline);white-space:nowrap}
tbody td{padding:9px 12px 9px 0;border-bottom:1px solid var(--grid);color:var(--ink-2);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-sunk)}
tfoot td{padding:9px 12px 0 0;border-top:1px solid var(--baseline);font-weight:650;
         color:var(--ink);white-space:nowrap}
th.num,td.num,tfoot td.num{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums}
tbody td.num,tfoot td.num{font-weight:500}
td.num{color:var(--ink)}
td.nm{color:var(--ink);font-weight:620}
td.dt{font-family:var(--num);font-variant-numeric:tabular-nums}
tdtd.career{white-space:normal;min-width:190px}
tr.us td{background:color-mix(in srgb,var(--t) 8%,transparent)}
tr.us:hover td{background:color-mix(in srgb,var(--t) 14%,transparent)}
.holder{display:inline-flex;align-items:center;gap:7px}
.holder .swatch{width:9px;height:9px;border-radius:2px;flex:none}
.kindtag{font-size:12.5px;color:var(--ink-muted)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;
      padding:2px 8px 2px 6px;border-radius:999px;border:1px solid var(--hair);
      background:var(--surface-sunk);color:var(--ink);white-space:nowrap}
.pill .gl{font-family:var(--num);font-size:11px;line-height:1}

.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12.5px;padding:2px 8px;border-radius:3px;background:var(--surface-sunk);
      border:1px solid var(--hair);color:var(--ink-2);white-space:nowrap}
.chip.kye{color:var(--ink);border-color:color-mix(in srgb,var(--t) 38%,var(--hair));
          background:color-mix(in srgb,var(--t) 9%,transparent)}

/* 참고 내역 — 공시가 아닌 과거 보도 기준이므로 시각적으로 낮춘다 */
.hist{border-top:1px solid var(--baseline);padding-top:14px;display:flex;flex-direction:column;gap:11px}
.hist-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.hist-head h3{margin:0;font-size:12.5px;font-weight:640;color:var(--ink)}
.hist-note{font-size:11.5px;color:var(--ink-muted);max-width:78ch}
.hist table tbody td{color:var(--ink-muted)}
.hist table tbody td.nm{color:var(--ink-2);font-weight:600}
.hist table tbody td.num{color:var(--ink-2)}
.dual{display:grid;grid-template-columns:118px 1fr;gap:12px;align-items:start;
      padding:11px 0;border-bottom:1px solid var(--grid)}
.dual:last-child{border-bottom:0}
.dual .who{font-size:12.5px}
.dual .who .p{font-size:11px;color:var(--ink-muted)}

.tip{position:absolute;z-index:20;pointer-events:none;opacity:0;transform:translate(-50%,-100%);
     transition:opacity .1s ease;background:var(--surface);color:var(--ink);border:1px solid var(--hair);
     border-radius:3px;box-shadow:var(--shadow);padding:8px 10px;min-width:150px;font-size:11.5px;line-height:1.45}
.tip.on{opacity:1} .tip.below{transform:translate(-50%,12px)}
.tip .tt{font-weight:640;margin-bottom:4px}
.tip .tr{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tip .tr .n{font-family:var(--num);font-variant-numeric:tabular-nums}
.tip .tk{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}

   회사마다 새 페이지에서 시작하고, 탭 버튼 자리에는 제목을 넣는다.
   OS가 다크 모드여도 인쇄물은 항상 밝은 색으로 강제한다.
   ═══════════════════════════════════════════════════════════════ */
@media print {

  :root, :root[data-theme="dark"], :root:where(:not([data-theme="light"])) {
    color-scheme: light;

    --good-text:#046004; --warning:#a86e00; --critical:#b32626;
    --shadow:none;
  }
  body { background:#fff; font-size:13px }
  .wrap { max-width:none; margin:0; padding:0; gap:5px }
  * { -webkit-print-color-adjust:exact; print-color-adjust:exact }

  /* 서브탭 버튼·인쇄 버튼·툴팁은 인쇄하지 않는다. 3사 탭 요약 카드도 인쇄하지 않음 —
     "전체 인쇄"가 터미널별 3개의 별도 인쇄로 바뀌면서(2026-08-25) 한 장에 3사를 같이
     보여줄 문서 자체가 없어졌다. 회사 하나짜리 보고서에 3사 요약은 군더더기다. */
  .subtabs, .printbtn, .tip, .tabs { display:none !important }
  .tab { transform:none !important; box-shadow:none !important;
         border-color:var(--hair) !important; break-inside:avoid }
  .tab::before { display:none }

  /* 인쇄 범위 —
     기본(속성 없음, 브라우저 Ctrl+P 포함)과 data-print="view": 보고 있는 회사의 보고 있는 항목만.
     data-print="all": 보고 있는 회사의 숨겨 둔 항목(섹션)까지 모두 펼쳐 한 문서로.
     어느 쪽이든 지금 선택된 회사 패널만 대상 — 다른 회사 패널은 여전히 [hidden]으로 숨어 있다.
     "전체 인쇄" 버튼은 printAllByCompany()가 회사를 하나씩 select()로 바꿔 가며
     이 'all' 인쇄를 3번 순서대로 실행해 회사마다 별도의 인쇄/저장 창을 띄운다. */
  body[data-print="all"] .section[hidden] { display:flex !important }

  /* 전체 인쇄에서 항목(실적·지분구조·증자·차입·이사회)마다 새 페이지로 끊는다(2026-08-25) —
     항목끼리 이어 붙이지 말라는 요청. `.section + .section`은 "바로 앞 형제가 .section인
     .section"만 골라서 첫 항목(앞이 subtabs) 앞에는 안 걸리고 둘째 항목부터 걸린다.
     이렇게 하면 이 화면 인쇄에서 확인한 항목별 페이지 수(실적2·지분구조1·증자1·차입1·이사회1)가
     전체 인쇄에서도 항목마다 그대로 재현된다 — 회사당 6페이지. */
  body[data-print="all"] .section + .section { break-before: page; page-break-before: always }

  .print-only { display:block }
  .print-co { font-size:17px; font-weight:700; letter-spacing:-.02em; color:var(--ink);
              padding-bottom:3px; border-bottom:2px solid var(--t) }
  .print-co .code { font-family:var(--mono); font-size:13px; font-weight:700; color:var(--ink-2) }
  .print-co .sub { display:block; font-size:11.5px; font-weight:400; color:var(--ink-muted); margin-top:2px }
  .print-co { break-after:avoid; page-break-after:avoid }
  .print-sec { font-size:20px; font-weight:700; color:var(--ink);
               padding:2px 0 4px; border-bottom:1px solid var(--hair); margin-top:0;
               break-after:avoid; page-break-after:avoid }

  .panel { gap:6px }
  .section { gap:6px; break-inside: auto }
  .card, .spec, .cum { break-inside: avoid; page-break-inside: avoid }
  .card { box-shadow:none; padding:7px 12px; gap:6px }

  /* 실적 탭: 1페이지 = 올해 실적+월간 실적, 2페이지 = 누적 실적+연도별 실적으로 고정(2026-08-25).
     원래는 break-inside:avoid로 남는 공간에 맞춰 자연스럽게 흘렀는데, 회사마다 여유가 달라
     BPT·JUCT는 누적 실적까지 1페이지에 붙고 GWCT만 2페이지로 밀리는 등 회사마다 결과가
     달랐다 — 사용자가 페이지 구성을 고정해 달라고 해서 누적 실적(`cumCard`) 앞에 강제로 끊는다. */
  .perf-p2 { break-before: page; page-break-before: always }

  /* 인쇄물에는 스크롤이 없다 — 표를 줄여서 폭에 맞춘다 */
  .perfwrap, .tablescroll { overflow: visible !important }
  .perf { font-size:10.5px }
  /* 열 폭은 헤더 글자가 결정한다 — .perf thead th 가 더 구체적이라 따로 눌러줘야 한다 */
  .perf thead th { font-size:9.5px; padding:0 5px 5px }
  /* 화면용 .perf tbody td{padding:8px 10px}·:first-child 규칙이 .perf th,.perf td보다
     구체적이라 예전엔 인쇄 축소가 전혀 먹지 않았다(항상 8px로 찍혔음) — 같은 구체성으로 눌러준다 */
  .perf tbody td { padding:3px 5px }
  .perf tbody td:first-child { padding-top:3px; padding-bottom:3px }
  table { font-size:11.5px }
  thead th { font-size:10.5px; padding:0 6px 5px 0 }
  tbody td { padding:3px 6px 3px 0 }
  td.note-cell, th.note-cell { font-size:10px; padding-left:10px; max-width:32ch }

  .pill { font-size:10.5px }
  .kindtag, .vitem { font-size:10.5px }
  /* 지분구조 상단 KPI 타일 — 화면용 값은 24px(히어로 50px)로 커서 한 번도 인쇄 축소 대상이
     아니었다. BPT처럼 주주가 많아 표가 긴 회사는 이것 때문에 1페이지 여유가 17px까지 빠듯했다 */

const fmt = n => n.toLocaleString('en-US');
const pct2 = n => n.toFixed(2) + '%';
const won = n => n === null || n === undefined ? '—' : fmt(n);
const dday = to => Math.round((new Date(to) - new Date(TODAY)) / 86400000);

/* 임기 상태 — 색만으로 전달하지 않고 글리프 + 라벨을 함께 붙인다 */
/* 1회 임기 — 정관 기준: 이사 2년, 감사 3년.
   취임일~만료일 차이는 중임 누적분이므로 임기로 쓰지 않는다. */
const TERM = { 이사: 2, 감사: 3 };
function termYears(o) {
  return o.term ?? (o.kind === '감사' ? TERM.감사 : TERM.이사);
}

function remaining(d) {
  const mo = Math.round(d / 30.44);
  if (mo < 12) return `잔여 ${mo}개월`;
  const y = Math.floor(mo / 12), m = mo % 12;
  return m ? `잔여 ${y}년 ${m}개월` : `잔여 ${y}년`;
}

/* 임기 잔여 기간 — 판단이 아니라 만료일까지 남은 기간만 표시한다 */
function termStatus(to) {
  if (!to) return { label: '확인 필요', glyph: '·', color: 'var(--ink-muted)', d: Infinity };
  const d = dday(to);
  if (d < 0)    return { label: `만료 D+${-d}`, glyph: '▲', color: 'var(--critical)', d };
  if (d <= 30)  return { label: `D-${d}`,       glyph: '▲', color: 'var(--critical)', d };
  if (d <= 90)  return { label: `D-${d}`,       glyph: '▲', color: 'var(--warning)',  d };
  return { label: remaining(d), glyph: '', color: 'var(--ink-2)', d };
}
const swatch = c => el('span', { class: 'swatch', style: `background:${c}` });

/* 세그먼트 색 — 그 터미널 색의 순차 램프(진→연).
   78% 단계는 세 색 모두 light/dark 서피스 대비 2:1 이상으로 검증됨.
   기타주주·자기주식은 실체가 다르므로 중립 회색. */
function segColors(cap) {
  let named = 0, outs = 0;
  return cap.map(r => {
    if (r.neutral) return r.treasury ? 'var(--seg-tre)' : 'var(--seg-etc)';
    if (r.outside) {
      const mix = [100, 76, 58, 44, 33][outs++] ?? 26;
      return `color-mix(in srgb, var(--seg-out) ${mix}%, var(--surface))`;
    }
    return (named++ === 0) ? 'var(--t)' : 'color-mix(in srgb, var(--t) 78%, var(--surface))';
  });
}

function attachTip(box) {
  const tip = el('div', { class: 'tip', role: 'status' });
  box.appendChild(tip);
  return {
    at(ev, html) {
      const r = box.getBoundingClientRect();
      const x = ev.clientX - r.left, y = ev.clientY - r.top;
      tip.innerHTML = html;
      tip.classList.toggle('below', y < 96);
      tip.style.left = Math.max(84, Math.min(r.width - 84, x)) + 'px';
      tip.style.top = (y < 96 ? y : y - 12) + 'px';
      tip.classList.add('on');
    },
    hide() { tip.classList.remove('on'); }
  };
}

function derive(co) {
  const us = co.cap.find(r => r.us);
  const treasury = co.cap.find(r => r.treasury);
  const votingBase = co.shares.total;  /* 공시 서식 기준 — 자기주식도 분모에 포함 */
  const board = co.officers.filter(o => o.kind !== '감사');
  const audit = co.officers.filter(o => o.kind === '감사');
  return {
    us, treasury, votingBase, board, audit,
    insidePct: co.cap.filter(r => r.inside).reduce((s, r) => s + r.pct, 0),
    usVoting: us.pct,
    expiring: co.officers.filter(o => termStatus(o.to).d <= 90).length,
    affilCount: co.officers.filter(o => o.affil.length).length

}

/* ═══════════════════════════════════════════════════════════════
   100% 누적 지분 바 — 세그먼트 사이는 2px 서피스 색이 갈라준다.
   칸 안에 라벨을 넣지 않고 바로 아래 값 목록이 범례와 값을 겸한다.
   ═══════════════════════════════════════════════════════════════ */
let _clipN = 0;
function stackBar(co) {
  const W = 700, H = 38, R = 4, GAP = 2;
  const clipId = 'clip-' + co.id + '-' + (++_clipN);
  const cols = segColors(co.cap);
  const g = [], segs = [];
  let x = 0;
  co.cap.forEach((r, i) => {
    const w = r.pct / 100 * W;
    g.push(svg('rect', { x, y: 0, width: w, height: H, style: `fill:${cols[i]}` }));
    segs.push({ x, w, r, c: cols[i] });
    x += w;
  });
  segs.slice(1).forEach(s =>
    g.push(svg('rect', { x: s.x - GAP / 2, y: -1, width: GAP, height: H + 2, style: 'fill:var(--surface)' })));

  const node = svg('svg', {
    viewBox: `0 0 ${W} ${H}`, role: 'img',
    'aria-label': '주주별 지분율 100% 누적 — ' + co.cap.map(r => `${r.nm} ${pct2(r.pct)}`).join(', ')
  }, [
    svg('defs', {}, [svg('clipPath', { id: clipId }, [svg('rect', { x: 0, y: 0, width: W, height: H, rx: R })])]),
    svg('g', { 'clip-path': `url(#${clipId})` }, g)
  ]);

  const box = el('div', { class: 'stack' }, [node]);
  const tip = attachTip(box);
  segs.forEach(s => {
    const hit = svg('rect', { x: s.x, y: 0, width: s.w, height: H, style: 'fill:transparent' });
    node.appendChild(hit);
    const on = ev => tip.at(ev,
      `<div class="tt">${s.r.nm}</div>` +
      `<div class="tr"><span class="tk"><span class="swatch" style="background:${s.c}"></span>${s.r.tag}</span></div>` +
      `<div class="tr"><span class="tk">지분율</span><span class="n">${pct2(s.r.pct)}</span></div>` +
      `<div class="tr"><span class="tk">보유주식</span><span class="n">${fmt(s.r.shares)}주</span></div>` +
      (s.r.book ? `<div class="tr"><span class="tk">장부가액</span><span class="n">${fmt(s.r.book)}백만원</span></div>` : ''));
    hit.addEventListener('mouseenter', on);
    hit.addEventListener('mousemove', on);
    hit.addEventListener('mouseleave', () => tip.hide());
  });
  return box;
}

        cumItem('매출액', P.total.rev),
        cumItem('매출이익', P.total.gross),
        cumItem('영업이익', P.total.op),
        cumItem('당기순이익', P.total.net)
      ]),
      P.note ? el('div', { class: 'card-note wide', text: '※ ' + P.note }) : null
    ]);
  } else {
    ytdCard = el('div', { class: 'card' }, [
      el('div', { class: 'card-head' }, [
        el('div', {}, [
          el('h2', { text: '올해 실적' }),
          el('div', { class: 'card-note', text: '경영실적 보고 기준' })
        ])
      ]),
      el('div', { class: 'nodata', text: '경영실적 자료 준비 중' })
    ]);
    cumCard = null; perfCard = null; monCard = null;
  }

  /* ═══ 차입 현황 ═══ */
  let debtCard;
  if (co.debt) {
    const D = co.debt;
    debtCard = el('div', { class: 'card' }, [
      el('div', { class: 'card-head' }, [
        el('div', {}, [
          el('h2', { text: '차입 현황' }),
          el('div', { class: 'card-note', text: `${D.asof} 기준` })
        ]),
        el('span', { class: 'unitlabel', text: '금액: 백만원' })
      ]),
      el('table', {}, [
        el('thead', {}, [el('tr', {}, [
          el('th', { text: '차입처' }), el('th', { text: '내역' }),
          el('th', { class: 'num', text: '잔액' }), el('th', { class: 'num', text: '이자율' }),
          el('th', { class: 'num', text: '만기' }), el('th', { class: 'note-cell', text: '비고' })
        ])]),
        el('tbody', {}, D.rows.map((r, ri) => el('tr', { class: r.sub ? 'subrow' : '' }, [
          el('td', { class: 'nm', text: (r.sub || (ri > 0 && D.rows[ri - 1].lender === r.lender)) ? '' : r.lender }),
          el('td', { text: r.item }),
          el('td', { class: 'num dt', text: fmt(r.amt) }),
          el('td', { class: 'num dt', text: r.rate || '' }),
          el('td', { class: 'num dt', text: r.due || '' }),
          el('td', { class: 'note-cell', text: r.note || '' })
        ]))),
        el('tfoot', {}, [el('tr', {}, [
          el('td', { text: '총 계' }), el('td', {}),
          el('td', { class: 'num', text: fmt(D.total) }),
          el('td', {}), el('td', {}), el('td', {})
        ])])
      ]),
      D.note ? el('div', { class: 'card-note wide', text: '※ ' + D.note }) : null
    ]);
  } else {
    debtCard = el('div', { class: 'card' }, [
      el('div', { class: 'card-head' }, [
        el('div', {}, [
          el('h2', { text: '차입 현황' }),
          co.noDebt ? el('div', { class: 'card-note', text: `${GROUP.fyEnd} 결산 기준` }) : null
        ])
      ]),
      el('div', { class: 'nodata', text: co.noDebt ? '차입금 없음' : '차입금 자료 준비 중' })
    ]);
  }

  /* ═══ 자본금 변동 (증자) ═══ */
  /* 추정값은 점선 밑줄 + 툴팁으로 확정값과 구분한다 */
  const PROV_TIP = '액면발행(발행가 = 액면가 10,000원)을 가정해 납입금액에서 산출한 추정값 — 등기부 확인 필요';
  const prov = (isEst, txt) => isEst
    ? el('span', { class: 'prov', title: PROV_TIP, text: txt })
    : document.createTextNode(txt);

  let capitalCard;
  if (co.capital) {
    const C = co.capital;
    const inc = C.rows.filter(r => r.kind === '증자');
    const totalPaid = inc.reduce((a, r) => a + (r.paid || 0), 0);
    capitalCard = el('div', { class: 'card' }, [
      el('div', { class: 'card-head' }, [
        el('div', {}, [
          el('h2', { text: '자본금 변동' }),
          el('div', { class: 'card-note',
            text: `증자 ${inc.length}회 · 납입 합계 ${fmt(totalPaid)} · 현재 자본금 ${fmt(co.fin.capital)}` })
        ]),
        el('span', { class: 'unitlabel', text: '금액: 백만원' })
      ]),
      el('div', { class: 'tablescroll' }, [
        el('table', {}, [
          el('thead', {}, [el('tr', {}, [
            el('th', { text: '시점' }), el('th', { text: '구분' }),
            el('th', { class: 'num', text: '발행주식 증감' }), el('th', { class: 'num', text: '주당 발행가' }),
            el('th', { class: 'num', text: '납입금액' }), el('th', { class: 'num', text: '자본금 누계' }),
            el('th', { class: 'note-cell', text: '비고' })
          ])]),
          el('tbody', {}, C.rows.map(r => el('tr', { class: r.kind === '기준' ? 'subrow' : '' }, [
            el('td', { class: 'dt nm', text: r.date }),
            el('td', { text: r.event }),
            el('td', { class: 'num dt' }, r.chk
              ? [el('span', { class: 'needchk', text: '확인 필요' })]
              : r.add === null ? [document.createTextNode('—')]
              : [prov(r.est, (r.kind === '증자' ? '+' : '') + fmt(r.add))]),
            el('td', { class: 'num dt' }, [prov(r.estPrice, fmt(r.price) + '원')]),
            el('td', { class: 'num dt', text: r.paid === null ? '—' : fmt(r.paid) }),
            el('td', { class: 'num dt' }, [prov(r.estTotal, fmt(r.total))]),
            el('td', { class: 'note-cell', text: r.note || '' })
          ])))
        ])
      ]),
      C.note ? el('div', { class: 'card-note wide', text: '※ ' + C.note }) : null
    ]);
  } else {
    capitalCard = el('div', { class: 'card' }, [
      el('div', { class: 'card-head' }, [el('div', {}, [el('h2', { text: '자본금 변동' })])]),
      el('div', { class: 'nodata', text: '증자 자료 준비 중' })
    ]);
  }

  /* ═══ 섹션 분할 + 서브탭 ═══ */
  const SECTIONS = [
    ['실적', [ytdCard, monCard, cumCard, perfCard]],
    ['지분구조', [kpis, capCard]],
    ['증자', [capitalCard]],
    ['차입', [debtCard]],
    ['이사회', [compCard, roster]]
  ];
  const subtabs = el('div', { class: 'subtabs', role: 'tablist', 'aria-label': '항목 선택' });
  const sectionEls = [];
  const subBtns = [];
  SECTIONS.forEach(([label, cards], si) => {
    /* 인쇄물에는 서브탭 버튼이 없으므로 섹션 제목을 대신 넣는다 */
    const sec = el('div', { class: 'section' }, [
      el('div', { class: 'print-only print-sec', text: label }),
      ...cards.filter(Boolean)
    ]);
    sec.hidden = si !== 0;
    sectionEls.push(sec);
    const btn = el('button', {
      class: 'subtab', type: 'button', role: 'tab',
      'aria-selected': String(si === 0), text: label
    });
    btn.addEventListener('click', () => {
      sectionEls.forEach((x, k) => { x.hidden = k !== si; });
      subBtns.forEach((b, k) => b.setAttribute('aria-selected', String(k === si)));
    });
    subBtns.push(btn);
    subtabs.appendChild(btn);
  });

  const printHead = el('div', { class: 'print-only print-co' }, [
    document.createTextNode(co.name + ' '),
    el('span', { class: 'code', text: '(' + co.code + ')' }),
    el('span', { class: 'sub', text: co.sub })
  ]);

  return el('div', {
    class: 'panel', id: `panel-${co.id}`, role: 'tabpanel',
    'aria-labelledby': `tab-${co.id}`, tabindex: '0', style: `--t:${co.hue}`
  }, [printHead, spec, subtabs, ...sectionEls]);
}

/* ═══════════════════════════════════════════════════════════════ 탭 */
const tabsRoot = document.querySelector('.tabs');
const panelsRoot = document.getElementById('panels');
const tabEls = [];

/* 탭 카드 지표 — 올해(진행 중) 실적을 전년 연간 실적으로 나눈 진행률.
   기준선은 경과 개월수 비율(예: 7/12 = 58.3%)로, 이보다 높으면 작년 페이스를 앞선다. */
const lastOf = (co, key) => co.perf ? co.perf[key][co.perf.cols.length - 1] : null;
const prevOf = (co, key) => co.perf ? co.perf[key][co.perf.cols.length - 2] : null;

function paceBar(label, cur, prev) {
  if (cur === null || cur === undefined || !prev) {
    return el('div', { class: 'metric' }, [
      el('span', { class: 'mk', text: label }),
      el('div', { class: 'mtrack' }, []),
      el('span', { class: 'mv', text: '—' })
    ]);
  }
  /* 색은 회사 식별색으로 고정한다. 빨강은 적자에만 쓴다 —
     절반 미달을 색으로 표시하면 화면에 설명이 없는 채 판단만 남는다.

     '달성률'은 흑자 구간에서만 뜻이 통하므로 네 경우로 나눠 말을 바꾼다 —
     흑자→흑자: 달성률 % / 적자→적자: 작년 연간 적자의 n배
     흑자→적자: 적자 전환 / 적자→흑자: 흑자 전환 */
  const bothLoss = prev < 0 && cur < 0;
  const toLoss   = prev >= 0 && cur < 0;
  const toProfit = prev < 0 && cur >= 0;
  const bad = bothLoss || toLoss;
  let p, text;
  if (bothLoss) {
    /* 작년·올해 모두 적자 — 작년 연간 적자 대비 진행률에 마이너스를 붙여
       달성률과 부호로 구분한다(적자 규모가 클수록 큰 음수). */
    p = Math.abs(cur / prev) * 100;
    text = '-' + p.toFixed(0) + '%';
  } else if (toLoss) {
    p = Math.abs(cur / prev) * 100;
    text = '-' + p.toFixed(0) + '%';
  } else if (toProfit) {
    p = 100; text = '흑자 전환';
  } else {
    p = cur / prev * 100;
    text = p.toFixed(0) + '%';
  }
  /* 툴팁 — 계산식·배수 설명은 빼고 올해·작년 실측값 두 개만 보여준다(2026-08-25 단순화).
     달성률·전환 여부는 막대 옆 .mv 라벨에 이미 나와 있으니 hover에서는 값만 확인하면 된다. */
  const why = `올해 ${fmt(cur)} · 작년 ${fmt(prev)}`;
  /* 트랙 전체 = 작년 연간 실적 100%, 눈금은 딱 절반(50%).
     100%를 넘으면 막대를 꽉 채우고 오른쪽 끝에 초과 표시를 붙인다. */
  const over = p > 100;
  const w = Math.max(Math.min(p, 100), 1.5);
  return el('div', { class: 'metric',
    title: `${label} — ${why}` }, [
    el('span', { class: 'mk', text: label }),
    el('div', { class: 'mtrack' }, [
      el('div', { class: 'mfill' + (bad ? ' neg' : '') + (over ? ' over' : ''),
        style: `width:${w}%` }),
      el('div', { class: 'mmark', style: 'left:50%' })
    ]),
    el('span', { class: 'mv' + (bad ? ' behind' : ''), text })
  ]);
}

COMPANIES.forEach(co => {
  const idx = tabEls.length;
  const d = derive(co);
  const btn = el('button', {
    class: 'tab', type: 'button', role: 'tab', id: `tab-${co.id}`,
    'aria-controls': `panel-${co.id}`, 'aria-selected': String(idx === 0),
    tabindex: idx === 0 ? '0' : '-1', style: `--t:${co.hue}`
  }, [
    el('div', { class: 'tab-head' }, [
      el('div', {}, [
        el('div', { class: 'tab-name', text: co.name })
      ]),
      el('span', { class: 'tab-code' }, [
        el('span', { class: 'tdot', 'aria-hidden': 'true' }),
        el('span', { text: co.code })
      ])
    ]),
    el('div', { class: 'tab-metrics' }, [
      el('div', { class: 'tab-cap', text: co.perf ? '작년 실적 대비 올해 달성률' : '' }),
      paceBar('물동량', lastOf(co, 'vol'), prevOf(co, 'vol')),
      paceBar('영업이익', lastOf(co, 'op'), prevOf(co, 'op'))
    ])
  ]);

  const panel = buildPanel(co);
  panel.hidden = idx !== 0;
  btn.addEventListener('click', () => select(idx));
  tabsRoot.appendChild(btn);
  panelsRoot.appendChild(panel);
  tabEls.push({ btn, panel });
});

function select(i) {
  tabEls.forEach((x, j) => {
    const on = i === j;
    x.btn.setAttribute('aria-selected', String(on));
    x.btn.tabIndex = on ? 0 : -1;
    x.panel.hidden = !on;
  });
}

document.getElementById('asof-d').textContent = TODAY;
/* 인쇄 범위를 body에 표시하고 인쇄 — 끝나면 지워서 Ctrl+P 기본값(현재 화면)으로 돌린다 */
function printWith(scope) {
  document.body.dataset.print = scope;
  window.print();
}
window.addEventListener('afterprint', () => { delete document.body.dataset.print; });
document.getElementById('print-view').addEventListener('click', () => printWith('view'));

/* 전체 인쇄 — 회사마다 완전히 별도의 인쇄/저장 창을 띄운다(2026-08-25 변경).
   예전엔 3사를 한 문서(12페이지)로 합쳐 찍었으나, 회사별로 따로 저장할 일이 많아
   select()로 회사를 하나씩 바꿔가며 '해당 회사의 전 항목' 인쇄를 3번 순서대로 실행한다.
   window.print()는 인쇄 대화상자가 닫혀야 다음 줄로 넘어가므로 afterprint를 기다려 순서를 지킨다.
   끝나면 원래 보고 있던 회사 탭으로 되돌린다. */
function printOnce(scope) {
  return new Promise(resolve => {
    window.addEventListener('afterprint', function onAfter() {
      window.removeEventListener('afterprint', onAfter);
      resolve();
    });
    document.body.dataset.print = scope;
    window.print();
  });
}
async function printAllByCompany() {
  const btn = document.getElementById('print-all');
  const restore = tabEls.findIndex(x => x.btn.getAttribute('aria-selected') === 'true');
  btn.disabled = true;
  for (let i = 0; i < tabEls.length; i++) {
    select(i);
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    await printOnce('all');
  }
  select(restore < 0 ? 0 : restore);
  btn.disabled = false;
}
document.getElementById('print-all').addEventListener('click', printAllByCompany);

tabsRoot.addEventListener('keydown', e => {
  const cur = tabEls.findIndex(x => x.btn === document.activeElement);
  if (cur < 0) return;
  let next = null;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next = (cur + 1) % tabEls.length;
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   next = (cur - 1 + tabEls.length) % tabEls.length;
  if (e.key === 'Home') next = 0;
  if (e.key === 'End')  next = tabEls.length - 1;
  if (next === null) return;
  e.preventDefault();
  select(next);
  tabEls[next].btn.focus();
});
</script>
